
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        main {
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        p {
            color: #777;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #222;
            border-radius: 30px;
            color: #222;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a:hover {
            background: #222;
            color: white;
        }

        footer {
            position: absolute;
            bottom: 25px;
            font-size: 0.75rem;
            color: #aaa;
        }
    </style>
</head>

<body>

    <main>
        <h1>Bienvenue.</h1>
        <p>Un espace simple, à votre image.</p>
        <a href="contacts.html">Découvrir</a>
    </main>

    <footer>
        © 2026 — Tous droits réservés
    </footer>

</body>
</html>
